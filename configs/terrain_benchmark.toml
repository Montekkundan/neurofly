seed = 0
render = true
save_video = true
output_dir = "outputs/terrain_benchmark"
episode_duration_s = 10.0
stumble_force_threshold = 1.0
slip_speed_threshold = 0.02
contact_force_threshold = 0.5
trials = 1
spawn_bbox = [-2.0, -2.0, 4.0, 4.0]
spawn_z = 0.5
timestep = 0.0001

[terrains]
names = ["flat", "rough", "blocks"]

[controllers]
names = ["cpg", "rule_based", "hybrid"]

[metrics]
names = [
  "distance_before_failure",
  "average_speed",
  "stumble_count",
  "slip_count",
  "success_rate",
]
