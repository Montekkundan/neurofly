[project]
name = "neurofly"
version = "0.1.0"
description = "Reproducible NeuroMechFly terrain locomotion and odor navigation benchmarks."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "flygym-gymnasium[examples]>=1.3.2,<2.0.0",
    "matplotlib>=3.9,<4.0",
    "pandas>=2.2,<3.0",
    "scipy>=1.13,<2.0",
    "typer>=0.16,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.11,<0.12",
]

[project.scripts]
neurofly-env-check = "neurofly.env_check:main"
neurofly-terrain-benchmark = "neurofly.terrain_benchmark:app"
neurofly-terrain-research = "neurofly.terrain_research:app"
neurofly-odor-env-check = "neurofly_odor.env_check:main"
neurofly-odor-benchmark = "neurofly_odor.odor_benchmark:app"
neurofly-odor-research = "neurofly_odor.navigation_research:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/neurofly", "src/neurofly_odor"]

[tool.ruff]
line-length = 100
target-version = "py311"
